spring.application.name=finanzas-personales
spring.profiles.default=demo
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.jackson.deserialization.fail-on-unknown-properties=true
server.port=${SERVER_PORT:8080}
server.error.include-message=never

springdoc.override-with-generic-response=false
springdoc.packages-to-scan=edu.co.icesi.finanzas.api
springdoc.swagger-ui.persist-authorization=false

app.jwt.secret=${JWT_SECRET}
app.jwt.duration-seconds=${JWT_DURATION_SECONDS:3600}

# Origenes permitidos para la SPA de React (Vite dev, Vite preview y Tomcat local).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:8080,http://127.0.0.1:8080}
