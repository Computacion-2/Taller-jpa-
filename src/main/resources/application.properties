spring.application.name=finanzas-personales
spring.profiles.default=demo
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.jackson.deserialization.fail-on-unknown-properties=true
server.port=${SERVER_PORT:8080}
server.error.include-message=never

springdoc.override-with-generic-response=false
springdoc.packages-to-scan=edu.co.icesi.finanzas.api
springdoc.swagger-ui.persist-authorization=false

app.jwt.secret=${JWT_SECRET}
app.jwt.duration-seconds=${JWT_DURATION_SECONDS:3600}
