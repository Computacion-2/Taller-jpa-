<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body class="auth-page">
<header th:replace="~{fragments/layout :: header}"></header>
<main id="contenido" class="auth-shell">
    <section th:replace="~{auth/poster :: poster('Empieza por un poco de orden.', 'Tus próximos planes merecen un lugar. Haz de tus finanzas una parte más clara de tu día a día.')}"></section>
    <section class="auth-card stack" aria-labelledby="registro-titulo">
        <div class="auth-form-heading">
            <p class="auth-kicker">Un nuevo comienzo</p>
            <h2 id="registro-titulo">Crear cuenta</h2>
            <p class="muted">Un espacio para ti, con tu correo institucional.</p>
        </div>
        <div th:replace="~{fragments/layout :: mensajes}"></div>
        <form th:action="@{/registro}" th:object="${registro}" method="post" class="stack">
            <div class="alert alert-error" role="alert" th:if="${#fields.hasGlobalErrors()}"><p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p></div>
            <div class="form-group">
                <label for="nombreCompleto">Nombre completo</label>
                <input id="nombreCompleto" th:field="*{nombreCompleto}" maxlength="150" autocomplete="name" required th:errorclass="input-error">
                <p class="field-error" th:if="${#fields.hasErrors('nombreCompleto')}" th:errors="*{nombreCompleto}"></p>
            </div>
            <div class="form-group">
                <label for="correo">Correo institucional</label>
                <input id="correo" th:field="*{correo}" type="email" placeholder="tu.correo@u.icesi.edu.co" maxlength="150" autocomplete="username" required th:errorclass="input-error">
                <small class="muted">Usa tu correo @u.icesi.edu.co.</small>
                <p class="field-error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></p>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
                <small class="muted">Entre 8 y 72 caracteres. Por seguridad, vuelve a escribirla si hay errores.</small>
                <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>
            <div class="form-group">
                <label for="monedaId">Moneda principal</label>
                <select id="monedaId" th:field="*{monedaId}" required th:errorclass="input-error"><option value="">Selecciona una moneda</option><option th:each="moneda : ${monedas}" th:value="${moneda.id}" th:text="${moneda.codigo + ' — ' + moneda.nombre}"></option></select>
                <p class="field-error" th:if="${#fields.hasErrors('monedaId')}" th:errors="*{monedaId}"></p>
            </div>
            <button class="button" type="submit">Crear mi cuenta <span aria-hidden="true">↗</span></button>
        </form>
        <p class="auth-footer">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>.</p>
    </section>
</main>
</body>
</html>
