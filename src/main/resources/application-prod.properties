# Activar explicitamente en IAsLab. H2 persiste en disco, sin servidor externo.
# Escritura sin demora: una transaccion confirmada debe quedar en disco.
spring.datasource.url=jdbc:h2:file:${FINANZAS_DATA_PATH:./data/finanzas};WRITE_DELAY=0
spring.datasource.username=${DB_USER:finanzas}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.data-locations=classpath:db/data-base.sql
server.address=${SERVER_ADDRESS:127.0.0.1}
