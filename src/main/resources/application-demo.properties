# Solo demostracion local: los datos se reinician al detener el proceso.
spring.datasource.url=jdbc:h2:mem:finanzas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.data-locations=classpath:db/data-demo.sql

# Clave publica y exclusiva de la demostracion local.
app.jwt.secret=finanzas-demo-2026-clave-local-de-al-menos-32-bytes
